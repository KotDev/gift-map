    return '';
  }

  function renderCard(g) {
    var no = pad2(giftNo(g));
    var art = g.art
      ? '<div class="art"><img src="' + esc(g.art) + '" alt=""></div>'
      : '<div class="art" aria-hidden="true">' +
          '<div class="art-glyph">' + giftIcon(g.id) + '</div>' +
          '<span class="art-no">' + no + '</span>' +
          '<span class="art-tag">' + esc(g.title) + '</span>' +
        '</div>';

    // Видео-мем под описанием подарка. Поддерживается mp4/webm/mov,
    // а также gif/png. Если поля meme нет — блок не выводится.
    var meme = '';
    if (g.meme) {
      var isVideo = /\.(mp4|webm|mov)(\?|$)/i.test(g.meme);
      meme = '<figure class="meme">' +
        (isVideo
          ? '<video class="meme-video" src="' + esc(g.meme) + '" aria-label="' + esc(g.memeAlt || '') + '" ' +
              'loop muted autoplay playsinline webkit-playsinline preload="auto"></video>' +
            '<div class="meme-lost">SIGNAL LOST · ВИДЕО НЕ ЗАГРУЗИЛОСЬ</div>' +
            '<button type="button" class="meme-sound" aria-label="Включить звук" hidden>ЗВУК</button>'
          : '<img src="' + esc(g.meme) + '" alt="' + esc(g.memeAlt || '') + '" ' +
              'decoding="async" onerror="this.parentNode.hidden=true">') +
      '</figure>';
    }

    cardWrapEl.innerHTML =
      '<article class="card">' +
        art +
        '<div class="rarity" aria-label="крутка ' + giftNo(g) + ' из 5">05 / 05 · HARD</div>' +
        '<h2>' + esc(g.title) + '</h2>' +
        '<p class="msg">' + esc(g.msg) + '</p>' +
        meme +
        '<button type="button" class="claim" data-act="claim">Забрать</button>' +
        '<div class="card-num">SPIN ' + no + ' // ' + humanDate(g) + '</div>' +
      '</article>';

    initMemeVideo();
  }

  function openStage(g, animate) {
    clearCountdown();
    currentGift = g;
    cardWrapEl.innerHTML = '';
    renderCard(g);

    stageEl.classList.remove('revealed', 'flash', 'charging');
    stageEl.classList.add('on');
    stageEl.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    startFx();

    if (!animate) {
      stageEl.classList.add('revealed');
      window.setTimeout(resumeMemeVideo, 0);
    }
    busy = false;
  }

  // Полный сброс сцены: снимаем оверлей, глушим мем, чистим карточку.
  function resetStageView() {
    cancelSpin();
    clearCountdown();
    stopFx();
    stageEl.classList.remove('on', 'revealed', 'flash', 'charging');
    stageEl.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (currentMemeVideo) {
      try { currentMemeVideo.pause(); } catch (e) {}
    }
    cardWrapEl.innerHTML = '';
    if (spinStageEl) spinStageEl.classList.remove('run', 'take', 'drop', 'box-on');
    if (spinReelEl) spinReelEl.innerHTML = '';
    if (spinPickEl) spinPickEl.innerHTML = '';
    currentGift = null;
    currentMemeVideo = null;
    currentMemeBtn = null;
    busy = false;
  }

  function closeStage() {
    if (busy && !stageEl.classList.contains('revealed')) return;
    resetStageView();
    renderHome();
  }

  /* =========================================================
     Крутка: заряд → вспышка → карточка
     ========================================================= */
  var spinSeq = 0;
  var CHARGE_MS = reduceMotion ? 420 : 2600;
  var FLASH_MS = reduceMotion ? 260 : 460;

  function cancelSpin() {
    spinSeq++;
    busy = false;
  }

  // Раскладываем иконки всех подарков, в центр кладём выпавшую.
  function prepareSpinSequence(g) {
    if (!spinStageEl || !spinReelEl || !spinPickEl) return;
    spinStageEl.classList.remove('run', 'take', 'drop', 'box-on');
    var html = '';
    for (var i = 0; i < CONFIG.gifts.length; i++) {
      html += '<div class="spin-chip" style="animation-delay:' + (i * 0.14) + 's">' +
                giftIcon(CONFIG.gifts[i].id) +
              '</div>';
    }
    spinReelEl.innerHTML = html;
    spinPickEl.innerHTML = giftIcon(g.id);
  }

  function startSpin(g) {
    if (!g || busy) return;
    busy = true;
    var seq = ++spinSeq;

    stageEl.style.setProperty('--chargeMs', CHARGE_MS + 'ms');
    stageEl.classList.add('charging');
    if (!reduceMotion) prepareSpinSequence(g);
    converge();
    chargeTone(CHARGE_MS);

    if (!reduceMotion && spinStageEl) {
      // иконки гаснут одна за другой
      window.setTimeout(function () {
        if (seq !== spinSeq) return;
        spinStageEl.classList.add('run');
      }, 120);
      // выпавшая иконка появляется в центре
      window.setTimeout(function () {
        if (seq !== spinSeq) return;
        spinStageEl.classList.add('take');
      }, 1160);
      // снизу выезжает коробка
      window.setTimeout(function () {
        if (seq !== spinSeq) return;
        spinStageEl.classList.add('box-on');
      }, 1380);
      // подарок падает в коробку
      window.setTimeout(function () {
        if (seq !== spinSeq) return;
        spinStageEl.classList.add('drop');
      }, 1800);
    }

    window.setTimeout(function () {
      if (seq !== spinSeq) return;
      converge();
    }, Math.round(CHARGE_MS * 0.55));

    window.setTimeout(function () {
      if (seq !== spinSeq) return;
      stageEl.classList.remove('charging');
      stageEl.classList.add('flash');
      burst();
      whoosh();
    }, CHARGE_MS);

    window.setTimeout(function () {
      if (seq !== spinSeq) return;
      stageEl.classList.remove('flash');
      stageEl.classList.add('revealed');
      resumeMemeVideo();
      if (markSeen(g.id)) notifyOpened(g);
      chime();
      renderHome();
    }, CHARGE_MS + FLASH_MS);

    window.setTimeout(function () {
      if (seq !== spinSeq) return;
      busy = false;
    }, CHARGE_MS + FLASH_MS + 80);
  }

  /* =========================================================
     Звук (Web Audio, без файлов)
     ========================================================= */
  var audioCtx = null;

  function ensureAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }

  function chargeTone(ms) {
    try {
      var ac = audioCtx;
      if (!ac || ac.state === 'closed') return;
      var t = ac.currentTime + 0.02;
      var dur = Math.max(0.22, ms / 1000);
      var o = ac.createOscillator();
      var g = ac.createGain();
      var f = ac.createBiquadFilter();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(55, t);
      o.frequency.exponentialRampToValueAtTime(190, t + dur);
      f.type = 'lowpass';
      f.frequency.setValueAtTime(420, t);
      f.frequency.exponentialRampToValueAtTime(1900, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.3);
      g.gain.setValueAtTime(0.05, t + Math.max(0.34, dur - 0.16));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(f); f.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  }

  function whoosh() {
    try {
      var ac = audioCtx;
      if (!ac || ac.state === 'closed') return;
      var t = ac.currentTime;
      var len = Math.floor(ac.sampleRate * 0.5);
      var buf = ac.createBuffer(1, len, ac.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
      }
      var src = ac.createBufferSource();
      src.buffer = buf;
      var f = ac.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.setValueAtTime(420, t);
      f.frequency.exponentialRampToValueAtTime(4200, t + 0.42);
      f.Q.value = 0.8;
      var g = ac.createGain();
      g.gain.setValueAtTime(0.2, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      src.connect(f); f.connect(g); g.connect(ac.destination);
      src.start(t);
    } catch (e) {}
  }

  function chime() {
    try {
      var ac = audioCtx;
      if (!ac || ac.state === 'closed') return;
      var t = ac.currentTime + 0.01;

      // низкий удар
      var o = ac.createOscillator();
      var g = ac.createGain();
      var f = ac.createBiquadFilter();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(38, t + 0.42);
      f.type = 'lowpass';
      f.frequency.setValueAtTime(900, t);
      f.frequency.exponentialRampToValueAtTime(180, t + 0.42);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      o.connect(f); f.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.6);

      // металлический щелчок
      var len = Math.floor(ac.sampleRate * 0.18);
      var buf = ac.createBuffer(1, len, ac.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5);
      }
      var src = ac.createBufferSource();
      src.buffer = buf;
      var nf = ac.createBiquadFilter();
      nf.type = 'highpass';
      nf.frequency.value = 1800;
      var ng = ac.createGain();
      ng.gain.setValueAtTime(0.12, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      src.connect(nf); nf.connect(ng); ng.connect(ac.destination);
      src.start(t);
    } catch (e) {}
  }

  /* =========================================================
     Canvas сцены: звёзды, сближение, вспышка
     ========================================================= */
  var canvasEl = document.getElementById('fx');
  var g2d = canvasEl.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var stars = [];
  var parts = [];
  var rafId = null;
  var fxOn = false;

  function makeStars() {
    stars = [];
    var count = Math.round((W * H) / 9000);
    count = Math.max(36, Math.min(170, count));
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.4 + Math.random() * 1.15,
        a: 0.2 + Math.random() * 0.55,
        ph: Math.random() * Math.PI * 2,
        sp: 0.004 + Math.random() * 0.014,
        vy: 0.015 + Math.random() * 0.075,
        drift: 0.08 + Math.random() * 0.22,
        tint: Math.random() < 0.26 ? '#ff2440' : (Math.random() < 0.4 ? '#d3ff3f' : '#ffffff')
      });
    }
  }

  function sizeCanvas() {
    var rect = canvasEl.getBoundingClientRect();
    W = Math.max(1, Math.round(rect.width || window.innerWidth));
    H = Math.max(1, Math.round(rect.height || window.innerHeight));
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvasEl.width = Math.round(W * DPR);
    canvasEl.height = Math.round(H * DPR);
    g2d.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeStars();
  }

  function burst() {
    if (reduceMotion) return;
    var cx = W / 2;
    var cy = H * 0.44;
    var palette = ['#ff2440', '#ff5a6e', '#d3ff3f', '#ffffff', '#c9ced6', '#ff2440', '#8a9098'];
    for (var i = 0; i < 150; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = 1.6 + Math.random() * 8.6;
      parts.push({
        x: cx + (Math.random() - 0.5) * 10,
        y: cy + (Math.random() - 0.5) * 10,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 0.9,
        r: 0.9 + Math.random() * 2.4,
        life: 1,
        decay: 0.008 + Math.random() * 0.014,
        drag: 0.991,
        g: 0.028,
        c: palette[(Math.random() * palette.length) | 0]
      });
    }
  }

  function converge() {
    if (reduceMotion) return;
    var cx = W / 2;
    var cy = H * 0.44;
    var palette = ['#ff2440', '#ff5a6e', '#d3ff3f', '#ffffff', '#c9ced6'];
    for (var i = 0; i < 64; i++) {
      var ang = Math.random() * Math.PI * 2;
      var dist = Math.min(W, H) * (0.34 + Math.random() * 0.38);
      var sp = 0.9 + Math.random() * 2.4;
      parts.push({
        x: cx + Math.cos(ang) * dist,
        y: cy + Math.sin(ang) * dist,
        vx: -Math.cos(ang) * sp,
        vy: -Math.sin(ang) * sp,
        r: 0.7 + Math.random() * 1.5,
        life: 1,
        decay: 0.005 + Math.random() * 0.006,
        drag: 0.996,
        g: 0,
        c: palette[(Math.random() * palette.length) | 0]
      });
    }
  }

  function drawStars(time) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      if (!reduceMotion) {
        s.ph += s.sp;
        s.y -= s.vy;
        s.x += Math.sin(s.ph * 0.4) * s.drift * 0.06;
        if (s.y < -3) { s.y = H + 3; s.x = Math.random() * W; }
        if (s.x < -3) s.x = W + 3;
        if (s.x > W + 3) s.x = -3;
      }
      var tw = 0.65 + 0.35 * Math.sin(s.ph + time * 0.0004);
      g2d.globalAlpha = Math.max(0, s.a * tw);
      g2d.fillStyle = s.tint;
      g2d.beginPath();
      g2d.arc(s.x, s.y, s.r, 0, 6.2832);
      g2d.fill();
    }
    g2d.globalAlpha = 1;
  }

  function drawParts() {
    if (!parts.length) return;
    g2d.globalCompositeOperation = 'lighter';
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.g;
      p.life -= p.decay;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      g2d.globalAlpha = Math.max(0, Math.min(1, p.life));
      g2d.fillStyle = p.c;
      g2d.beginPath();
      g2d.arc(p.x, p.y, p.r * (0.35 + p.life * 0.8), 0, 6.2832);
      g2d.fill();
    }
    g2d.globalCompositeOperation = 'source-over';
    g2d.globalAlpha = 1;
  }

  function paint(time) {
    g2d.clearRect(0, 0, W, H);
    g2d.globalCompositeOperation = 'source-over';
    drawStars(time || 0);
    drawParts();
  }

  function frame(time) {
    if (!fxOn) return;
    paint(time);
    rafId = window.requestAnimationFrame(frame);
  }

  function startFx() {
    if (!W || !H) sizeCanvas();
    fxOn = true;
    paint(0);
    if (!reduceMotion && rafId === null) {
      rafId = window.requestAnimationFrame(frame);
    }
  }

  function stopFx() {
    fxOn = false;
    if (rafId !== null) {
      window.cancelAnimationFrame(rafId);
      rafId = null;
    }
    parts = [];
    g2d.clearRect(0, 0, W, H);
  }

  /* =========================================================
     Частицы на главном экране (искры / цифровая пыль)
     ========================================================= */
  var snowEl = document.getElementById('snow');
  var sctx = snowEl ? snowEl.getContext('2d') : null;
  var flakes = [], sW = 0, sH = 0, sDpr = 1, snowRaf = null, snowRunning = false;

  function sizeSnow() {
    if (!snowEl || !sctx) return;
    sDpr = Math.min(2, window.devicePixelRatio || 1);
    sW = window.innerWidth;
    sH = window.innerHeight;
    snowEl.width = Math.round(sW * sDpr);
    snowEl.height = Math.round(sH * sDpr);
    sctx.setTransform(sDpr, 0, 0, sDpr, 0, 0);
    makeFlakes();
    drawSnow();
  }

  function makeFlakes() {
    flakes = [];
    if (reduceMotion) return;
    var n = Math.round(Math.min(92, Math.max(30, (sW * sH) / 24000)));
    var palette = ['255,36,64', '255,90,110', '211,255,63', '255,255,255', '150,150,160'];
    for (var i = 0; i < n; i++) {
      flakes.push({
        x: Math.random() * sW,
        y: Math.random() * sH,
        r: 0.5 + Math.random() * 1.8,
        vy: 0.18 + Math.random() * 0.82,
        ph: Math.random() * Math.PI * 2,
        sw: 0.2 + Math.random() * 0.8,
        a: 0.16 + Math.random() * 0.58,
        len: 4 + Math.random() * 16,
        c: palette[(Math.random() * palette.length) | 0]
      });
    }
  }

  function drawSnow() {
    if (!sctx) return;
    sctx.clearRect(0, 0, sW, sH);
    sctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      var tw = 0.55 + 0.45 * Math.sin(f.ph * 2.3);
      var a = Math.max(0, f.a * tw);
      sctx.strokeStyle = 'rgba(' + f.c + ',' + a.toFixed(3) + ')';
      sctx.lineWidth = Math.max(0.6, f.r);
      sctx.beginPath();
      sctx.moveTo(f.x, f.y);
      sctx.lineTo(f.x - f.sw * 2, f.y + f.len);
      sctx.stroke();
      sctx.fillStyle = 'rgba(' + f.c + ',' + Math.min(1, a * 1.8).toFixed(3) + ')';
      sctx.fillRect(f.x, f.y, f.r, f.r);
    }
    sctx.globalCompositeOperation = 'source-over';
  }

  function snowLoop() {
    if (!snowRunning) return;
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.ph += 0.016;
      f.y -= f.vy;
      f.x += Math.sin(f.ph) * f.sw * 0.5;
      if (f.y + f.len < -8) { f.y = sH + 10; f.x = Math.random() * sW; }
      if (f.x < -8) f.x = sW + 8;
      if (f.x > sW + 8) f.x = -8;
    }
    drawSnow();
    snowRaf = window.requestAnimationFrame(snowLoop);
  }

  function startSnow() {
    if (reduceMotion || snowRunning || !flakes.length) return;
    snowRunning = true;
    snowRaf = window.requestAnimationFrame(snowLoop);
  }

  function stopSnow() {
    snowRunning = false;
    if (snowRaf !== null) {
      window.cancelAnimationFrame(snowRaf);
      snowRaf = null;
    }
  }

  /* =========================================================
     События
     ========================================================= */
  document.addEventListener('pointerdown', function () {
    soundUnlocked = true;
    ensureAudio();
  }, { once: true, capture: true });

  function scrollToMap() {
    var el = document.getElementById('map');
    if (!el) return;
    try { el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' }); }
    catch (e) { el.scrollIntoView(); }
  }

  nextCardEl.addEventListener('click', function (ev) {
    var btn = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'scroll') { scrollToMap(); return; }
    if (act === 'spin') {
      var g = findGift(btn.getAttribute('data-id'));
      if (g) openStage(g, true);
    }
  });

  mapStopsEl.addEventListener('click', function (ev) {
    var btn = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!btn) return;
    var g = findGift(btn.getAttribute('data-id'));
    if (!g) return;
    openStage(g, btn.getAttribute('data-act') === 'spin');
  });

  spinBtnEl.addEventListener('click', function () {
    ensureAudio();
    startSpin(currentGift);
  });

  cardWrapEl.addEventListener('click', function (ev) {
    var btn = ev.target.closest ? ev.target.closest('[data-act="claim"]') : null;
    if (!btn) return;
    closeStage();
  });

  closeBtnEl.addEventListener('click', closeStage);

  stageEl.addEventListener('click', function (ev) {
    if (ev.target === stageEl) closeStage();
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && stageEl.classList.contains('on')) closeStage();
    if (ev.key === 'Escape' || ev.key === 'Enter' || ev.key === ' ') dismissIntro();
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () {
      sizeCanvas();
      if (fxOn) paint(0);
      sizeSnow();
    }, 180);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      clearCountdown();
      stopSnow();
      if (bgVideoEl) bgVideoEl.pause();
    } else {
      startSnow();
      playBgVideo();
      if (stageEl.classList.contains('on') && stageEl.classList.contains('revealed')) {
        resumeMemeVideo();
      } else if (!stageEl.classList.contains('on')) {
        renderHome();
      }
    }
  });

  /* =========================================================
     Старт
     ========================================================= */
  if (introEl) {
    introEl.addEventListener('click', dismissIntro);
    startIntro();
  }

  initBgVideo();
  renderHome();
  sizeCanvas();
  sizeSnow();
  startSnow();

  if (window.location.protocol.indexOf('http') === 0 && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      try { navigator.serviceWorker.register('./sw.js').catch(function () {}); }
      catch (e) {}
    });
  }
})();
</script>
</body>
</html>
