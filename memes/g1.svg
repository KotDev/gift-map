<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1f2b"/>
      <stop offset="0.55" stop-color="#5b2f3a"/>
      <stop offset="1" stop-color="#243b3a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffd18a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffd18a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="270" fill="url(#bg1)"/>
  <rect width="480" height="270" fill="url(#glow1)"/>

  <text x="240" y="62" text-anchor="middle" font-size="25" font-weight="bold" fill="#ffe7a8">КТО ПЧЁЛОК УВАЖАЕТ —</text>
  <text x="240" y="94" text-anchor="middle" font-size="25" font-weight="bold" fill="#ffe7a8">ТОТ К НИМ НЕ ПРИСТАЁТ</text>

  <!-- летающая пчела -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="70,160; 390,135; 300,195; 120,185; 70,160" dur="7s" repeatCount="indefinite"/>
    <g>
      <ellipse cx="0" cy="0" rx="27" ry="18" fill="#ffcf4a" stroke="#2b1a10" stroke-width="2"/>
      <path d="M-10 -17 L-10 17 M4 -17 L4 17 M17 -13 L17 13" stroke="#2b1a10" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="-16" cy="0" rx="9" ry="7" fill="#2b1a10"/>
      <circle cx="-18" cy="-2" r="2" fill="#fff"/>
      <path d="M23 -2 L34 -9 M23 4 L34 11" stroke="#2b1a10" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="-4" cy="-17" rx="15" ry="9" fill="#dff6ff" opacity="0.8" transform="rotate(-24 -4 -17)">
        <animate attributeName="opacity" values="0.8;0.35;0.8" dur="0.22s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="12" cy="-16" rx="13" ry="8" fill="#dff6ff" opacity="0.7" transform="rotate(18 12 -16)">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="0.22s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- цветок -->
  <g transform="translate(392 214)">
    <path d="M0 24 L0 2" stroke="#7fbf8a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-13" cy="34" rx="15" ry="7" fill="#4d8c62"/>
    <ellipse cx="13" cy="34" rx="15" ry="7" fill="#4d8c62"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4;4;-4" dur="4s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="8" fill="#ffd18a"/>
      <circle cx="0" cy="-13" r="9" fill="#f2b9b0"/>
      <circle cx="12" cy="-4" r="9" fill="#f2b9b0"/>
      <circle cx="7" cy="10" r="9" fill="#f2b9b0"/>
      <circle cx="-7" cy="10" r="9" fill="#f2b9b0"/>
      <circle cx="-12" cy="-4" r="9" fill="#f2b9b0"/>
    </g>
  </g>

  <text x="240" y="244" text-anchor="middle" font-size="13" fill="#ffe7a8" opacity="0.72">цветы прилагаются · пчёлы — нет</text>
</svg>
