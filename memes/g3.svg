<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1e31"/>
      <stop offset="0.55" stop-color="#43283f"/>
      <stop offset="1" stop-color="#1f3038"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#ffb3b3" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffb3b3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="270" fill="url(#bg3)"/>
  <rect width="480" height="270" fill="url(#glow3)"/>

  <text x="240" y="52" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffd6d0">ДАВЛЕНИЕ СО СТОРОНЫ</text>
  <text x="240" y="82" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffd6d0">КОЛЛЕГ — НЕ ГЛАВНОЕ</text>

  <!-- тонометр -->
  <g transform="translate(240 180)">
    <rect x="-96" y="-58" width="192" height="116" rx="18" fill="#e9eef2" stroke="#b7c3cc" stroke-width="3"/>
    <rect x="-76" y="-40" width="152" height="62" rx="10" fill="#16232b"/>
    <text x="-26" y="-2" text-anchor="middle" font-size="30" font-weight="bold" fill="#9fe3b0">120</text>
    <text x="38" y="-2" text-anchor="middle" font-size="30" font-weight="bold" fill="#9fe3b0">80</text>
    <text x="6" y="10" text-anchor="middle" font-size="15" fill="#9fe3b0">/</text>
    <circle cx="-64" cy="34" r="5" fill="#d65b5b"/>
    <rect x="0" y="28" width="58" height="12" rx="6" fill="#b7c3cc"/>
    <path d="M-76 -10 Q-110 -18 -112 16" stroke="#8a9aa5" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="-124" y="12" width="24" height="34" rx="7" fill="#c7d2da" stroke="#8a9aa5" stroke-width="2"/>
  </g>

  <!-- пульсирующее сердце -->
  <g transform="translate(352 196)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.25;1;1;1.15;1" dur="1.4s" repeatCount="indefinite"/>
      <path d="M0 12 C-18 -2 -22 -16 -12 -21 C-4 -25 0 -18 0 -14 C0 -18 4 -25 12 -21 C22 -16 18 -2 0 12 Z" fill="#ff7b7b"/>
    </g>
    <text x="0" y="34" text-anchor="middle" font-size="10" fill="#ffd6d0" opacity="0.8">пульс</text>
  </g>

  <text x="240" y="250" text-anchor="middle" font-size="13" fill="#ffd6d0" opacity="0.72">пусть будет 120 на 80 — и никаких сюрпризов</text>
</svg>
