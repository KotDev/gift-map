<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122a24"/>
      <stop offset="0.55" stop-color="#1d3c33"/>
      <stop offset="1" stop-color="#1c2d3b"/>
    </linearGradient>
    <radialGradient id="glow4" cx="0.5" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#b8f0c0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#b8f0c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquid4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ee6b0"/>
      <stop offset="1" stop-color="#3fb37b"/>
    </linearGradient>
  </defs>

  <rect width="480" height="270" fill="url(#bg4)"/>
  <rect width="480" height="270" fill="url(#glow4)"/>

  <text x="240" y="52" text-anchor="middle" font-size="23" font-weight="bold" fill="#c8f7d0">ЛЕКАРСТВА ОТ ЗДОРОВЬЯ</text>
  <text x="240" y="82" text-anchor="middle" font-size="23" font-weight="bold" fill="#c8f7d0">НЕ СУЩЕСТВУЕТ</text>

  <!-- пробирка -->
  <g transform="translate(190 182)">
    <path d="M-26 -62 L-26 28 Q-26 52 0 52 Q26 52 26 28 L26 -62 Z" fill="#dff6ff" fill-opacity="0.18" stroke="#bfe9e0" stroke-width="3"/>
    <path d="M-22 8 L-22 28 Q-22 46 0 46 Q22 46 22 28 L22 8 Z" fill="url(#liquid4)" opacity="0.9"/>
    <ellipse cx="-14" cy="-46" rx="7" ry="14" fill="#ffffff" opacity="0.28"/>
    <g fill="#c8f7d0">
      <circle cx="-8" cy="28" r="4">
        <animate attributeName="cy" values="28;8;8" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.5;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="9" cy="20" r="3">
        <animate attributeName="cy" values="30;4;4" dur="3.1s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.4;0" dur="3.1s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="34" r="2.5">
        <animate attributeName="cy" values="34;14;14" dur="2.7s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.3;0" dur="2.7s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- капсула -->
  <g transform="translate(316 176)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="3.6s" repeatCount="indefinite"/>
      <rect x="-38" y="-17" width="38" height="34" rx="17" fill="#ffd18a"/>
      <rect x="0" y="-17" width="38" height="34" rx="17" fill="#f2b9b0"/>
      <rect x="-4" y="-17" width="8" height="34" fill="#d9a46b" opacity="0.4"/>
    </g>
  </g>

  <text x="240" y="250" text-anchor="middle" font-size="13" fill="#c8f7d0" opacity="0.72">зато есть анализы — и это честнее</text>
</svg>
